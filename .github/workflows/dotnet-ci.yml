name: .NET Build & Headless xUnit Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore Coraline.sln

      - name: Build Solution (0 Errors Gate)
        run: dotnet build Coraline.sln --no-restore --configuration Release

      - name: Run Headless xUnit Suite
        run: dotnet test Coraline.sln --no-build --configuration Release --verbosity normal
